name: wolfxtg-bot

services:
  - name: bot
    type: worker
    git:
      branch: main
    build:
      builder: buildpack
      build_command: npm install -g pnpm && pnpm install --filter @workspace/telegram-bot
    run:
      command: node bot/index.js
    env:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        secret: TELEGRAM_BOT_TOKEN
    scaling:
      min: 1
      max: 1
    regions:
      - was
